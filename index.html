<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wooof 🐾</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #3a2e2a;
        --brand: #ff9d3d;
        --brand-dark: #f07c2e;
        --card: #fffdf8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Baloo 2", system-ui, sans-serif;
        color: var(--ink);
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #aee3ff 0%, #cdf1d8 55%, #ffe6b8 100%);
      }

      /* ---------- Login / Start screen ---------- */
      #login-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 26px;
        padding: 28px 26px 26px;
        box-shadow: 0 24px 60px rgba(60, 40, 20, 0.28);
        text-align: center;
        animation: pop 0.4s cubic-bezier(0.2, 1.2, 0.4, 1) both;
      }
      @keyframes pop {
        from { transform: scale(0.9) translateY(10px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }
      .mascot {
        width: 150px;
        height: 150px;
        margin: -78px auto 4px;
        object-fit: contain;
        filter: drop-shadow(0 10px 14px rgba(60, 40, 20, 0.25));
        animation: bob 3s ease-in-out infinite;
      }
      .mascot-fallback {
        font-size: 92px;
        margin: -60px auto 0;
        animation: bob 3s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      h1 {
        font-size: 46px;
        font-weight: 800;
        margin: 0;
        color: var(--brand);
        letter-spacing: 1px;
        text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(240, 124, 46, 0.3);
      }
      .tagline {
        margin: 2px 0 18px;
        font-weight: 500;
        color: #8a7a6e;
        font-size: 15px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        background: #f1e9dd;
        border-radius: 14px;
        padding: 5px;
        margin-bottom: 16px;
      }
      .tab {
        flex: 1;
        border: none;
        background: transparent;
        font-family: inherit;
        font-weight: 700;
        font-size: 15px;
        color: #a9998a;
        padding: 9px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .tab.active {
        background: #fff;
        color: var(--brand-dark);
        box-shadow: 0 2px 6px rgba(60, 40, 20, 0.12);
      }
      .field {
        display: block;
        width: 100%;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        padding: 13px 15px;
        margin-bottom: 11px;
        border: 2px solid #eadfce;
        border-radius: 13px;
        background: #fffefb;
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s;
      }
      .field:focus { border-color: var(--brand); }
      .play-btn {
        width: 100%;
        font-family: inherit;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
        background: linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 100%);
        border: none;
        border-radius: 14px;
        padding: 14px;
        margin-top: 4px;
        cursor: pointer;
        box-shadow: 0 6px 0 #d9691f, 0 10px 18px rgba(240, 124, 46, 0.35);
        transition: transform 0.08s, box-shadow 0.08s;
      }
      .play-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #d9691f, 0 6px 12px rgba(240, 124, 46, 0.3);
      }
      .msg {
        min-height: 20px;
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #e0574f;
      }

      /* ---------- Game ---------- */
      #game {
        display: none;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(60, 40, 20, 0.4);
        image-rendering: pixelated;
      }
      #game canvas { display: block; }
      body.playing { background: #1a1c2c; }
    </style>
  </head>
  <body>
    <!-- Login / Start screen -->
    <div id="login-overlay">
      <div class="card">
        <img
          class="mascot"
          id="mascot-img"
          src="/assets/dogs/dog1.png"
          alt="wooof Maskottchen"
          onerror="this.style.display='none'; document.getElementById('mascot-fallback').style.display='block';"
        />
        <div class="mascot-fallback" id="mascot-fallback" style="display:none">🐶</div>
        <h1>wooof</h1>
        <p class="tagline">Finde deine Hunde 🐾</p>

        <div class="tabs">
          <button class="tab active" id="tab-login">Anmelden</button>
          <button class="tab" id="tab-register">Neu hier</button>
        </div>

        <form id="auth-form" autocomplete="off">
          <input
            class="field"
            id="username"
            type="text"
            placeholder="Benutzername"
            autocomplete="username"
          />
          <input
            class="field"
            id="password"
            type="password"
            placeholder="Passwort"
            autocomplete="current-password"
          />
          <button class="play-btn" id="submit-btn" type="submit">Los geht's!</button>
        </form>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <!-- The game gets injected here after login -->
    <div id="game"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
